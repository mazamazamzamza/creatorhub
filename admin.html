<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - CreatorHub</title>
<link rel="stylesheet" href="style.css">
<style>
.admin-wrap{max-width:900px;margin:0 auto;padding:14px}
.admin-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;margin-bottom:16px;backdrop-filter:blur(8px)}
.drop{border:2px dashed #a855f7;border-radius:16px;padding:28px;text-align:center;background:rgba(168,85,247,.06);cursor:pointer}
.drop.drag{border-color:#d6ff00;background:rgba(214,255,0,.08)}
.preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:16px}
.p{position:relative;border-radius:12px;overflow:hidden;border:1px solid #222;height:160px}
.p img{width:100%;height:100%;object-fit:cover}
.p button{position:absolute;top:6px;right:6px;background:#ff2d2d;border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer}
.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.login-card{max-width:380px;margin:80px auto;background:linear-gradient(180deg,#1a1a20,#0f0f12);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:22px;text-align:center}
.login-card input{width:100%;background:#07070a;border:1px solid #222;border-radius:12px;padding:13px;margin-bottom:10px;color:#fff;outline:none}
</style>
</head>
<body>
<div id="loginView" class="login-card">
<h2 style="font-weight:900">🔐 Admin Login</h2>
<p style="color:#888;font-size:12px;margin:8px 0 14px">Accès réservé</p>
<input id="a_user" placeholder="Identifiant" value="admin">
<input id="a_pass" type="password" placeholder="Mot de passe" value="">
<button class="cta full" id="a_login">Se connecter</button>
<p id="a_err" style="color:#ff4d4d;font-size:11px;margin-top:8px;display:none">Identifiants invalides</p>
<p style="color:#555;font-size:10px;margin-top:10px">Accès: adminadminadmin / adminadminadmin</p>
<a href="index.html" style="color:#666;font-size:11px;display:block;margin-top:12px">← Retour site</a>
</div>

<div id="panelView" class="admin-wrap hidden">
<h2 style="font-weight:900;margin:10px 0">🔧 Admin - Gestion Images <button id="a_logout" style="float:right;background:#222;border:1px solid #333;color:#fff;padding:6px 12px;border-radius:999px;font-size:11px;cursor:pointer">Déconnexion</button></h2>
<p style="color:#888;font-size:12px;margin-bottom:12px">Upload tes images (consentement 18+ obligatoire). Stockage local.</p>
<div class="admin-card">
<div class="drop" id="drop">📤 Clique ou glisse tes images ici (JPG/PNG/WEBP)<br><small style="color:#aaa">Max ~15 images</small>
<input type="file" id="file" accept="image/*" multiple hidden>
</div>
<div class="admin-actions">
<button class="cta" id="save">💾 Sauvegarder</button>
<button class="cta ghost-btn" id="clear">🗑️ Tout effacer</button>
<a href="index.html" class="cta ghost-btn" style="text-decoration:none;display:grid;place-items:center">← Voir le site</a>
</div>
<div class="preview" id="preview"></div>
<p id="status" style="font-size:11px;color:#d6ff00;margin-top:10px"></p>
</div>
</div>

<script>
const ADMIN_USER='adminadminadmin';
const ADMIN_PASS='adminadminadmin';
const KEY='ch_imgs_custom';
const SESS='ch_admin_sess';
let imgs=JSON.parse(localStorage.getItem(KEY)||'null') || [];
const loginView=document.getElementById('loginView');
const panelView=document.getElementById('panelView');
function checkSess(){
  if(sessionStorage.getItem(SESS)==='1'){ loginView.classList.add('hidden'); panelView.classList.remove('hidden'); }
  else { loginView.classList.remove('hidden'); panelView.classList.add('hidden'); }
}
document.getElementById('a_login').onclick=()=>{
  const u=document.getElementById('a_user').value.trim();
  const p=document.getElementById('a_pass').value;
  if(u===ADMIN_USER && p===ADMIN_PASS){ sessionStorage.setItem(SESS,'1'); checkSess(); }
  else { document.getElementById('a_err').style.display='block'; }
};
document.getElementById('a_logout').onclick=()=>{ sessionStorage.removeItem(SESS); checkSess(); };
checkSess();
const preview=document.getElementById('preview');
const status=document.getElementById('status');
function render(){
  preview.innerHTML='';
  imgs.forEach((src,i)=>{
    const d=document.createElement('div');
    d.className='p';
    d.innerHTML=`<img src="${src}"><button>✕</button>`;
    d.querySelector('button').onclick=()=>{ imgs.splice(i,1); render(); };
    preview.appendChild(d);
  });
  status.textContent= imgs.length ? imgs.length+' image(s) en attente' : 'Aucune image custom';
}
function addFiles(files){
  const arr=[...files].filter(f=>f.type.startsWith('image/'));
  if(!arr.length) return;
  let pending=arr.length;
  arr.forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas'); const max=800;
        let w=img.width,h=img.height;
        if(w>max||h>max){ const s=Math.min(max/w,max/h); w*=s; h*=s; }
        c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
        imgs.push(c.toDataURL('image/jpeg',0.75));
        pending--; if(pending===0) render();
      }; img.src=e.target.result;
    }; r.readAsDataURL(f);
  });
}
const drop=document.getElementById('drop'); const file=document.getElementById('file');
drop.onclick=()=> file.click();
file.onchange=e=> addFiles(e.target.files);
drop.ondragover=e=>{ e.preventDefault(); drop.classList.add('drag'); };
drop.ondragleave=()=> drop.classList.remove('drag');
drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove('drag'); addFiles(e.dataTransfer.files); };
document.getElementById('save').onclick=()=>{ localStorage.setItem(KEY,JSON.stringify(imgs)); status.textContent='✅ Sauvegardé !'; status.style.color='#00ff6a'; };
document.getElementById('clear').onclick=()=>{ if(!confirm('Effacer ?')) return; imgs=[]; localStorage.removeItem(KEY); render(); };
render();
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && !panelView.classList.contains('hidden')===false) document.getElementById('a_login').click(); });
</script>
</body>
</html>
